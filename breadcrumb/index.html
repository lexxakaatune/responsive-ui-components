<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Breadcrumb</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="demo-page">
    <h1>Breadcrumb</h1>

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item">
          <a href="/" class="breadcrumb-link">Home</a>
        </li>
        <li class="breadcrumb-item">
          <a href="/products" class="breadcrumb-link">Products</a>
        </li>
        <li class="breadcrumb-item">
          <a href="/products/electronics" class="breadcrumb-link">Electronics</a>
        </li>
        <li class="breadcrumb-item">
          <span class="breadcrumb-current" aria-current="page">Laptops</span>
        </li>
      </ol>
    </nav>

    <nav class="breadcrumb breadcrumb-minimal" aria-label="Breadcrumb minimal">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item">
          <a href="/" class="breadcrumb-link">Dashboard</a>
        </li>
        <li class="breadcrumb-item">
          <a href="/settings" class="breadcrumb-link">Settings</a>
        </li>
        <li class="breadcrumb-item">
          <span class="breadcrumb-current" aria-current="page">Account</span>
        </li>
      </ol>
    </nav>
  </main>
</body>
</html>

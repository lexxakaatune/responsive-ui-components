<!DOCTYPE html>
<html lang="en">

  <title>Responsive Hero Section</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="hero">

      <h1 class="hero-title">Build Something Amazing</h1>

        <a href="#" class="btn btn-primary">Get Started</a>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Modal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-content">
    <h1>Modal Demo</h1>
    <button type="button" class="btn-open" data-modal="confirm-dialog">
      Open Modal
    </button>
  </main>

  <!-- Dialog -->
  <dialog
    id="confirm-dialog"
    class="modal"
    aria-labelledby="dialog-title"
    aria-describedby="dialog-desc"
    aria-modal="true"
  >
    <form method="dialog" class="modal-form">
      <header class="modal-header">
        <h2 id="dialog-title">Confirm Action</h2>
        <button
          type="button"
          class="modal-close"
          aria-label="Close dialog"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </header>

      <div class="modal-body">
        <p id="dialog-desc">
          Are you sure you want to proceed? This action cannot be undone and may affect your account settings.
        </p>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" value="cancel">
          Cancel
        </button>
        <button type="submit" class="btn btn-danger" value="confirm">
          Confirm
        </button>
      </footer>
    </form>
  </dialog>

  <script>
    (function () {
      const openBtn = document.querySelector('[data-modal="confirm-dialog"]');
      const dialog = document.getElementById('confirm-dialog');
      const closeBtn = dialog.querySelector('.modal-close');
      const cancelBtn = dialog.querySelector('[value="cancel"]');

      let lastFocused = null;

      function openModal() {
        lastFocused = document.activeElement;
        dialog.showModal();
        document.body.classList.add('modal-open');
        closeBtn.focus();
      }

      function closeModal() {
        dialog.close();
        document.body.classList.remove('modal-open');
        if (lastFocused) lastFocused.focus();
      }

      openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      cancelBtn.addEventListener('click', closeModal);

      // Close on backdrop click
      dialog.addEventListener('click', (e) => {
        const rect = dialog.getBoundingClientRect();
        const isBackdrop =
          e.clientX < rect.left ||
          e.clientX > rect.right ||
          e.clientY < rect.top ||
          e.clientY > rect.bottom;
        if (isBackdrop) closeModal();
      });

      // Close on Escape is handled natively by <dialog>,
      // but we still need to restore focus and body scroll
      dialog.addEventListener('close', () => {
        document.body.classList.remove('modal-open');
        if (lastFocused) lastFocused.focus();
      });

      // Focus trap
      dialog.addEventListener('keydown', (e) => {
        if (e.key !== 'Tab') return;

        const focusable = dialog.querySelectorAll(
          'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        );
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      });
    })();
  </script>
</body>
</html>
